- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Deny incoming by default
  community.general.ufw:
    direction: incoming
    default: deny

- name: Allow outgoing by default
  community.general.ufw:
    direction: outgoing
    default: allow

# Must exist before the firewall is enabled, or we lock ourselves out.
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port | string }}"
    proto: tcp
    from_ip: "{{ firewall_ssh_allowed_from }}"

- name: Allow web ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_allowed_tcp_ports }}"

- name: Enable UFW
  community.general.ufw:
    state: enabled
