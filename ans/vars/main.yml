# ssh
ssh_max_auth_tries: 3

# firewall
firewall_ssh_allowed_from: any # restrict to your IP, e.g. "203.0.113.10/32"
firewall_allowed_tcp_ports:
  - 80
  - 443

# updates
updates_auto_reboot: false
updates_reboot_time: "04:00"

# docker
docker_users:
  - admin
docker_app_owner: admin
docker_app_dirs:
  - /opt/app
  - /opt/app/data

# app
app_user: admin
app_registry: ghcr.io/rustc0
# Bump to the commit sha CI published, then re-run the playbook to deploy.
# Rolling back is the same command with the previous sha.
app_image_tag: latest
app_registry_username: rustc0
app_postgres_user: chatapp
app_postgres_db: chatapp

# Secrets come from secrets/vault.yml, which is git-ignored and vault-encrypted.
app_registry_token: "{{ vault_ghcr_token }}"
app_postgres_password: "{{ vault_postgres_password }}"
app_jwt_secret: "{{ vault_jwt_secret }}"
